version: 2
updates:
  # No runtime dependencies — only devDependencies (typescript, vitest, biome, the pi peer
  # packages). Minor and patch bumps arrive grouped in one PR; majors stay separate so a peer
  # dependency breakage is visible instead of auto-merged.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # actions/checkout and actions/setup-node in .github/workflows/ci.yml
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
